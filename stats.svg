<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460">
  <defs>
    <style>
      <![CDATA[
      .txt { font-family: monospace; font-size: 16px; fill: #ebdbb2; }
      .bold { font-weight: 700; }
      .sym { fill: #928374; }
      .c-green { fill: #b8bb26; }
      .c-red { fill: #fb4934; }
      .c-yellow { fill: #fabd2f; }
      .c-blue { fill: #83a598; }
      .c-orange { fill: #fe8019; }
      .c-purple { fill: #d3869b; }
      .c-aqua { fill: #8ec07c; }
      .cmd { fill: #fabd2f; }
      ]]>
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="460" fill="#1d2021" stroke="#3c3836" stroke-width="10"/>

  <!-- Command Prompt -->
  <text x="20" y="32" class="txt">
    <tspan class="c-blue">~/.github</tspan><tspan class="sym"> &gt; </tspan><tspan class="cmd">top</tspan> -u hyalokeraun --sort-by activity
  </text>

  <!-- ═══ SYSTEM LOAD ═══ -->
  <text x="20" y="72" class="txt"><tspan class="cmd bold">SYSTEM LOAD</tspan> <tspan class="sym">(Commit Graph Activity)</tspan></text>
  <rect x="20" y="84" width="480" height="18" rx="2" fill="#3c3836"/>
  <rect x="20" y="84" width="28" height="18" rx="2" fill="#b8bb26"/>
  <text x="510" y="98" class="txt"><tspan class="c-green">6%</tspan> <tspan class="sym">(Active)</tspan></text>

  <!-- ═══ MEMORY ALLOCATION ═══ -->
  <text x="20" y="140" class="txt"><tspan class="cmd bold">MEMORY ALLOCATION</tspan> <tspan class="sym">(Language Breakdown)</tspan></text>

  <!-- Lang 1 -->
  <text x="20" y="170" class="txt c-red">JavaScript</text>
  <rect x="130" y="156" width="340" height="18" rx="2" fill="#3c3836"/>
  <rect x="130" y="156" width="187" height="18" rx="2" fill="#fb4934"/>
  <text x="480" y="170" class="txt c-red"> 55.2%</text>

  <!-- Lang 2 -->
  <text x="20" y="197" class="txt c-green">Go        </text>
  <rect x="130" y="183" width="340" height="18" rx="2" fill="#3c3836"/>
  <rect x="130" y="183" width="95" height="18" rx="2" fill="#b8bb26"/>
  <text x="480" y="197" class="txt c-green"> 28.1%</text>

  <!-- Lang 3 -->
  <text x="20" y="224" class="txt c-orange">Python    </text>
  <rect x="130" y="210" width="340" height="18" rx="2" fill="#3c3836"/>
  <rect x="130" y="210" width="49" height="18" rx="2" fill="#fe8019"/>
  <text x="480" y="224" class="txt c-orange"> 14.5%</text>

  <!-- Lang 4 -->
  <text x="20" y="251" class="txt c-blue">Dockerfile</text>
  <rect x="130" y="237" width="340" height="18" rx="2" fill="#3c3836"/>
  <rect x="130" y="237" width="7" height="18" rx="2" fill="#83a598"/>
  <text x="480" y="251" class="txt c-blue">  2.1%</text>

  <!-- ═══ CURRENT PROCESSES ═══ -->
  <text x="20" y="295" class="txt cmd bold">CURRENT PROCESSES:</text>
  <rect x="20" y="303" width="780" height="1" fill="#504945"/>

  <!-- Table Header -->
  <text x="20" y="325" class="txt sym" xml:space="preserve">PID    USER         PR  NI  VIRT  RES  SHR S  %CPU  %MEM  COMMAND</text>

  <!-- Process 1 -->
  <text x="20" y="350" class="txt" xml:space="preserve"><tspan class="sym">001</tspan>    <tspan class="c-green">hyalokeraun</tspan>  20   0  784M  12M  8M  <tspan class="c-green">R</tspan>  <tspan class="c-red">99.9</tspan>   4.2  <tspan class="cmd">hyalokeraun</tspan></text>

  <!-- Process 2 -->
  <text x="20" y="375" class="txt" xml:space="preserve"><tspan class="sym">002</tspan>    <tspan class="c-green">hyalokeraun</tspan>  20   0  512M  10M  4M  <tspan class="c-yellow">S</tspan>  <tspan class="c-orange">45.0</tspan>   2.1  <tspan class="cmd">GoBytes</tspan></text>

  <!-- Process 3 -->
  <text x="20" y="400" class="txt" xml:space="preserve"><tspan class="sym">003</tspan>    <tspan class="c-green">hyalokeraun</tspan>  39  19  204M   8M  2M  <tspan class="c-yellow">S</tspan>  <tspan class="sym">00.0</tspan>   1.0  <tspan class="cmd">idle_process</tspan></text>

</svg>