  <!-- ═══ NEOFETCH ═══ -->
  <text x="20" y="650" class="txt">
    <tspan class="prompt-path">~/.github</tspan><tspan class="prompt-sign"> &gt; </tspan><tspan class="cmd">./fetch</tspan>
  </text>
  <text x="40" y="1070" class="txt"><tspan class="c-green">os:</tspan><tspan class="txt">            github profile</tspan></text>
  <text x="40" y="1090" class="txt"><tspan class="c-green">host:</tspan><tspan class="txt">          adamantite</tspan></text>
  <text x="40" y="1110" class="txt"><tspan class="c-green">kernel:</tspan><tspan class="txt">        endeavour</tspan></text>
  <text x="40" y="1130" class="txt"><tspan class="c-green">uptime:</tspan><tspan class="txt">        continuousgrind</tspan></text>
  <text x="40" y="1150" class="txt"><tspan class="c-green">shell:</tspan><tspan class="txt">         bash 5.1.16</tspan></text>
  
  <!-- ═══ EXIT ═══ -->
  <text x="20" y="1190" class="txt">
    <tspan class="prompt-path">~/.github</tspan><tspan class="prompt-sign"> &gt; </tspan><tspan class="cmd">exit</tspan>
  </text>
  <text x="40" y="1220" class="txt">logout</text>
  <text x="40" y="1240" class="txt">Connection closed.</text>

  <!-- Blinking Cursor -->
