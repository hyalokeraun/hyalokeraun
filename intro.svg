  <!-- ═══ NEOFETCH ═══ -->
  <text x="20" y="650" class="txt">
    <tspan class="prompt-path">~/.github</tspan><tspan class="prompt-sign"> &gt; </tspan><tspan class="cmd">./fetch</tspan>
  </text>
  <text x="40" y="1070" class="txt"><tspan class="prompt-path">OS:</tspan><tspan class="txt">        GitHub Profile</tspan></text>
  <text x="40" y="1090" class="txt"><tspan class="prompt-path">Host:</tspan><tspan class="txt">      Adamantite</tspan></text>
  <text x="40" y="1110" class="txt"><tspan class="prompt-path">Kernel:</tspan><tspan class="txt">    Endeavour</tspan></text>
  <text x="40" y="1130" class="txt"><tspan class="prompt-path">Uptime:</tspan><tspan class="txt">    Continuous Grind</tspan></text>
  <text x="40" y="1150" class="txt"><tspan class="prompt-path">Shell:</tspan><tspan class="txt">     bash 5.1.16</tspan></text>
  
  <!-- ═══ EXIT ═══ -->
  <text x="20" y="1190" class="txt">
    <tspan class="prompt-path">~/.github</tspan><tspan class="prompt-sign"> &gt; </tspan><tspan class="cmd">exit</tspan>
  </text>
  <text x="40" y="1220" class="txt">logout</text>
  <text x="40" y="1240" class="txt">Connection closed.</text>

  <!-- Blinking Cursor -->
  <rect x="20" y="1260" width="10" height="22" fill="#3c3836">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
