<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1300" viewBox="0 0 1000 1300">
  <defs>
    <style>
      <![CDATA[
       /* Base Typography */
      .txt { font-family: monospace; font-size: 18px; fill: #3c3836; }
      .bold { font-weight: 700; }
      
      /* Gruvbox Light Palette */
      .prompt-user { fill: #79740e; font-weight: 700; } /* green */
      .prompt-sign { fill: #928374; } /* gray */
      .prompt-path { fill: #076678; } /* blue */
      .cmd { fill: #b57614; } /* yellow */
      .sym { fill: #928374; } /* gray */
      
      /* Tree & Data Colors */
      .c-folder { fill: #8f3f71; font-weight: 700; } /* purple */
      .c-red { fill: #9d0006; }
      .c-yellow { fill: #b57614; }
      .c-green { fill: #79740e; }
      .c-blue { fill: #076678; }
      .c-purple { fill: #8f3f71; }
      ]]>
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect width="1000" height="1300" rx="0" ry="0" fill="#f2e5bc" stroke="#d5c4a1" stroke-width="10"/>
  
  <!-- ═══ SECTION 1: INTRO ═══ -->
  <text x="20" y="40" class="txt">
    <tspan class="prompt-path">~/.github</tspan><tspan class="prompt-sign"> &gt; </tspan><tspan class="cmd">whoami</tspan>
  </text>
  <text x="40" y="70" class="txt"><tspan class="prompt-sign"> :: </tspan>Authenticated as: <tspan class="prompt-user">hyalokeraun</tspan></text>
  <text x="40" y="90" class="txt"><tspan class="prompt-sign"> :: </tspan>Status: <tspan class="prompt-path">CS Undergrad</tspan></text>
  
  <text x="40" y="120" class="txt">Hey! I am Rohan Debnath. I operate in the architecture beneath the abstractions.</text>
  <text x="40" y="140" class="txt">Instead of just using frameworks, I dismantle them to understand the core</text>
  <text x="40" y="160" class="txt">logic. Currently focused on systems programming, algorithms, heavy</text>
  <text x="40" y="180" class="txt">computation, and the mathematical foundations of AI.</text>

  <!-- ═══ SECTION 2: INTERESTS ═══ -->
  <text x="20" y="220" class="txt">
    <tspan class="prompt-path">~/.github</tspan><tspan class="prompt-sign"> &gt; </tspan><tspan class="cmd">tree /home/hyalokeraun/interests/</tspan>
  </text>
  
  <text x="40" y="250" class="txt sym">.</text>
  <text x="40" y="280" class="txt sym">├── <tspan class="c-folder">low_level_programming/</tspan></text>
  <text x="40" y="310" class="txt sym">│   ├── <tspan class="c-red">compilers_&amp;_parsers</tspan></text>
  <text x="40" y="340" class="txt sym">│   ├── <tspan class="c-red">memory_management</tspan></text>
  <text x="40" y="370" class="txt sym">│   └── <tspan class="c-red">systems_architecture</tspan></text>
  <text x="40" y="400" class="txt sym">├── <tspan class="c-folder">mathematical_computation/</tspan></text>
  <text x="40" y="430" class="txt sym">│   ├── <tspan class="c-yellow">algorithms_&amp;_data_structures</tspan></text>
  <text x="40" y="460" class="txt sym">│   ├── <tspan class="c-yellow">matrix_&amp;_linear_algebra</tspan></text>
  <text x="40" y="490" class="txt sym">│   └── <tspan class="c-yellow">statistical_modeling</tspan></text>
  <text x="40" y="520" class="txt sym">└── <tspan class="c-folder">artificial_intelligence/</tspan></text>
  <text x="40" y="550" class="txt sym">    ├── <tspan class="c-green">neural_networks_core_concepts</tspan></text>
  <text x="40" y="580" class="txt sym">    ├── <tspan class="c-green">deep_learning_principles</tspan></text>
  <text x="40" y="610" class="txt sym">    └── <tspan class="c-green">unsupervised_learning</tspan></text>
 


