<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1120" viewBox="0 0 800 1120">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
    </style>
  </defs>

  <!-- Background: gruvchad black #1e2122 -->
  <rect width="800" height="1120" rx="0" ry="0" fill="#1e2122"/>

  <!-- ═══ NEOFETCH ═══ -->
  <text x="20" y="30" font-family="monospace" font-size="15">
    <tspan fill="#89b482" font-weight="700">hyalokeraun@deepcore</tspan><tspan fill="#606364">:</tspan><tspan fill="#6d8dad">~</tspan><tspan fill="#606364">$ </tspan><tspan fill="#d6b676">neofetch</tspan>
  </text>
  <text x="40" y="50" font-family="monospace" font-size="15"><tspan fill="#6d8dad">OS:</tspan><tspan fill="#c7b89d">        GitHub Profile</tspan></text>
  <text x="40" y="70" font-family="monospace" font-size="15"><tspan fill="#6d8dad">Host:</tspan><tspan fill="#c7b89d">      DeepCore</tspan></text>
  <text x="40" y="90" font-family="monospace" font-size="15"><tspan fill="#6d8dad">Kernel:</tspan><tspan fill="#c7b89d">    LowLevel+AI_System</tspan></text>
  <text x="40" y="110" font-family="JetBrains Mono,Courier New,monospace" font-size="15"><tspan fill="#6d8dad">Uptime:</tspan><tspan fill="#c7b89d">    Continuous Grind</tspan></text>
  <text x="40" y="130" font-family="JetBrains Mono,Courier New,monospace" font-size="15"><tspan fill="#6d8dad">Shell:</tspan><tspan fill="#c7b89d">     bash 5.1.16</tspan></text>
  <text x="40" y="150" font-family="JetBrains Mono,Courier New,monospace" font-size="15"><tspan fill="#6d8dad">Packages:</tspan><tspan fill="#c7b89d">  Compilers, Parsers, Math, DeepLearning</tspan></text>

  <!-- ═══ SELF DESCRIPTION ═══ -->
  <text x="20" y="190" font-family="JetBrains Mono,Courier New,monospace" font-size="15">
    <tspan fill="#89b482" font-weight="700">hyalokeraun@deepcore</tspan><tspan fill="#606364">:</tspan><tspan fill="#6d8dad">~</tspan><tspan fill="#606364">$ </tspan><tspan fill="#d6b676">cat self_description.md</tspan>
  </text>
  <text x="40" y="210" font-family="JetBrains Mono,Courier New,monospace" font-size="15"><tspan fill="#606364">&gt;</tspan><tspan fill="#c7b89d"> Exploring the bare metal of low-level systems,</tspan></text>
  <text x="40" y="230" font-family="JetBrains Mono,Courier New,monospace" font-size="15"><tspan fill="#606364"> </tspan><tspan fill="#c7b89d"> compilers, and parsers.</tspan></text>
  <text x="40" y="250" font-family="JetBrains Mono,Courier New,monospace" font-size="15"><tspan fill="#606364">&gt;</tspan><tspan fill="#c7b89d"> Architecting mathematical computation logic.</tspan></text>
  <text x="40" y="270" font-family="JetBrains Mono,Courier New,monospace" font-size="15"><tspan fill="#606364">&gt;</tspan><tspan fill="#c7b89d"> Delving deep into the core concepts of AI,</tspan></text>
  <text x="40" y="290" font-family="JetBrains Mono,Courier New,monospace" font-size="15"><tspan fill="#606364"> </tspan><tspan fill="#c7b89d"> Neural Networks, and DL.</tspan></text>

  <!-- ═══ WORK ETHIC ═══ -->
  <text x="20" y="330" font-family="JetBrains Mono,Courier New,monospace" font-size="15">
    <tspan fill="#89b482" font-weight="700">hyalokeraun@deepcore</tspan><tspan fill="#606364">:</tspan><tspan fill="#6d8dad">~</tspan><tspan fill="#606364">$ </tspan><tspan fill="#d6b676">echo</tspan><tspan fill="#c7b89d"> $WORK_ETHIC</tspan>
  </text>
  <text x="40" y="350" font-family="JetBrains Mono,Courier New,monospace" font-size="15"><tspan fill="#e78a4e">"WORKING IN SILENCE. RISING IN SECRET."</tspan></text>
  <text x="40" y="370" font-family="JetBrains Mono,Courier New,monospace" font-size="15"><tspan fill="#e78a4e">"OUTWORK EVERYONE."</tspan></text>

  <!-- ═══ GRIND ═══ -->
  <text x="20" y="410" font-family="JetBrains Mono,Courier New,monospace" font-size="15">
    <tspan fill="#89b482" font-weight="700">hyalokeraun@deepcore</tspan><tspan fill="#606364">:</tspan><tspan fill="#6d8dad">~</tspan><tspan fill="#606364">$ </tspan><tspan fill="#d6b676">./execute_grind.sh</tspan>
  </text>
  <text x="40" y="430" font-family="JetBrains Mono,Courier New,monospace" font-size="15"><tspan fill="#ec6b64">"The more I fall, the more I grind."</tspan></text>

  <!-- ═══ SYSTEM SKILLS SEPARATOR ═══ -->
  <text x="20" y="470" fill="#606364" font-family="JetBrains Mono,Courier New,monospace" font-size="15"># ──────────────────────────────────────────────────────────────────</text>
  <text x="20" y="490" fill="#606364" font-family="JetBrains Mono,Courier New,monospace" font-size="15"># </text>
  <text x="38" y="490" fill="#7daea3" font-family="JetBrains Mono,Courier New,monospace" font-size="15">[SYSTEM_SKILLS]</text>
  <text x="20" y="510" fill="#606364" font-family="JetBrains Mono,Courier New,monospace" font-size="15"># ──────────────────────────────────────────────────────────────────</text>

  <!-- ═══ PACMAN ═══ -->
  <text x="20" y="550" font-family="JetBrains Mono,Courier New,monospace" font-size="15">
    <tspan fill="#89b482" font-weight="700">hyalokeraun@deepcore</tspan><tspan fill="#606364">:</tspan><tspan fill="#6d8dad">~</tspan><tspan fill="#606364">$ </tspan><tspan fill="#d6b676">pacman -Q --explicit</tspan>
  </text>
  <text x="40" y="570" font-family="JetBrains Mono,Courier New,monospace" font-size="15"><tspan fill="#6d8dad">PACKAGE</tspan><tspan fill="#606364">             </tspan><tspan fill="#6d8dad">VERSION</tspan><tspan fill="#606364">         </tspan><tspan fill="#6d8dad">STATUS</tspan></text>
  <text x="40" y="590" fill="#606364" font-family="JetBrains Mono,Courier New,monospace" font-size="15">─────────────────────────────────────────────</text>
  <text x="40" y="610" font-family="JetBrains Mono,Courier New,monospace" font-size="15"><tspan fill="#c7b89d">c</tspan><tspan fill="#606364">                   </tspan><tspan fill="#ce8196">c17</tspan><tspan fill="#606364">             </tspan><tspan fill="#7daea3">[installed]</tspan></text>
  <text x="40" y="630" font-family="JetBrains Mono,Courier New,monospace" font-size="15"><tspan fill="#c7b89d">c++</tspan><tspan fill="#606364">                 </tspan><tspan fill="#ce8196">c++20</tspan><tspan fill="#606364">           </tspan><tspan fill="#7daea3">[installed]</tspan></text>
  <text x="40" y="650" font-family="JetBrains Mono,Courier New,monospace" font-size="15"><tspan fill="#c7b89d">rust</tspan><tspan fill="#606364">                </tspan><tspan fill="#ce8196">stable</tspan><tspan fill="#606364">          </tspan><tspan fill="#7daea3">[installed]</tspan></text>
  <text x="40" y="670" font-family="JetBrains Mono,Courier New,monospace" font-size="15"><tspan fill="#c7b89d">python</tspan><tspan fill="#606364">              </tspan><tspan fill="#ce8196">3.12</tspan><tspan fill="#606364">            </tspan><tspan fill="#7daea3">[installed]</tspan></text>
  <text x="40" y="690" font-family="JetBrains Mono,Courier New,monospace" font-size="15"><tspan fill="#c7b89d">x86-asm</tspan><tspan fill="#606364">             </tspan><tspan fill="#ce8196">nasm</tspan><tspan fill="#606364">            </tspan><tspan fill="#7daea3">[installed]</tspan></text>
  <text x="40" y="710" font-family="JetBrains Mono,Courier New,monospace" font-size="15"><tspan fill="#c7b89d">pytorch</tspan><tspan fill="#606364">             </tspan><tspan fill="#ce8196">latest</tspan><tspan fill="#606364">          </tspan><tspan fill="#7daea3">[installed]</tspan></text>
  <text x="40" y="730" font-family="JetBrains Mono,Courier New,monospace" font-size="15"><tspan fill="#c7b89d">linux</tspan><tspan fill="#606364">               </tspan><tspan fill="#ce8196">6.x</tspan><tspan fill="#606364">             </tspan><tspan fill="#7daea3">[installed]</tspan></text>
  <text x="40" y="750" font-family="JetBrains Mono,Courier New,monospace" font-size="15"><tspan fill="#c7b89d">neovim</tspan><tspan fill="#606364">              </tspan><tspan fill="#ce8196">0.10</tspan><tspan fill="#606364">            </tspan><tspan fill="#7daea3">[installed]</tspan></text>

  <!-- ═══ DOMAINS SEPARATOR ═══ -->
  <text x="20" y="790" fill="#606364" font-family="JetBrains Mono,Courier New,monospace" font-size="15"># ──────────────────────────────────────────────────────────────────</text>
  <text x="20" y="810" fill="#606364" font-family="JetBrains Mono,Courier New,monospace" font-size="15"># </text>
  <text x="38" y="810" fill="#7daea3" font-family="JetBrains Mono,Courier New,monospace" font-size="15">[DOMAINS]</text>
  <text x="20" y="830" fill="#606364" font-family="JetBrains Mono,Courier New,monospace" font-size="15"># ──────────────────────────────────────────────────────────────────</text>

  <!-- ═══ LS DOMAINS ═══ -->
  <text x="20" y="870" font-family="JetBrains Mono,Courier New,monospace" font-size="15">
    <tspan fill="#89b482" font-weight="700">hyalokeraun@deepcore</tspan><tspan fill="#606364">:</tspan><tspan fill="#6d8dad">~</tspan><tspan fill="#606364">$ </tspan><tspan fill="#d6b676">ls -la ~/domains/</tspan>
  </text>
  <text x="40" y="890" font-family="JetBrains Mono,Courier New,monospace" font-size="15"><tspan fill="#606364">drwxr-xr-x  </tspan><tspan fill="#6d8dad">compilers/</tspan><tspan fill="#606364">          # lexers, parsers, codegen</tspan></text>
  <text x="40" y="910" font-family="JetBrains Mono,Courier New,monospace" font-size="15"><tspan fill="#606364">drwxr-xr-x  </tspan><tspan fill="#6d8dad">low-level/</tspan><tspan fill="#606364">          # memory, syscalls, bare metal</tspan></text>
  <text x="40" y="930" font-family="JetBrains Mono,Courier New,monospace" font-size="15"><tspan fill="#606364">drwxr-xr-x  </tspan><tspan fill="#6d8dad">math/</tspan><tspan fill="#606364">               # linear algebra, calculus, dsp</tspan></text>
  <text x="40" y="950" font-family="JetBrains Mono,Courier New,monospace" font-size="15"><tspan fill="#606364">drwxr-xr-x  </tspan><tspan fill="#6d8dad">neural-networks/</tspan><tspan fill="#606364">    # backprop, transformers</tspan></text>
  <text x="40" y="970" font-family="JetBrains Mono,Courier New,monospace" font-size="15"><tspan fill="#606364">drwxr-xr-x  </tspan><tspan fill="#6d8dad">deep-learning/</tspan><tspan fill="#606364">      # cnns, rnns, generative</tspan></text>
  <text x="40" y="990" font-family="JetBrains Mono,Courier New,monospace" font-size="15"><tspan fill="#606364">drwxr-xr-x  </tspan><tspan fill="#6d8dad">ai-core/</tspan><tspan fill="#606364">            # gradient descent, optim</tspan></text>

  <!-- ═══ EXIT ═══ -->
  <text x="20" y="1030" font-family="JetBrains Mono,Courier New,monospace" font-size="15">
    <tspan fill="#89b482" font-weight="700">hyalokeraun@deepcore</tspan><tspan fill="#606364">:</tspan><tspan fill="#6d8dad">~</tspan><tspan fill="#606364">$ </tspan><tspan fill="#d6b676">exit</tspan>
  </text>
  <text x="40" y="1050" fill="#c7b89d" font-family="JetBrains Mono,Courier New,monospace" font-size="15">logout</text>
  <text x="40" y="1070" fill="#606364" font-family="JetBrains Mono,Courier New,monospace" font-size="15">Connection to deepcore closed.</text>

  <!-- Blinking cursor -->
  <rect x="20" y="1090" width="9" height="17" fill="#c7b89d">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
